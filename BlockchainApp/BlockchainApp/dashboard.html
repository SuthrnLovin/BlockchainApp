<!DOCTYPE html>
<html>
<head>
    <title>Stock Market</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        #price {
            font-size: 35px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .info {
            font-size: 18px;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        input {
            padding: 10px;
            width: 100px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

            button:hover {
                opacity: 0.8;
            }

        .chart-container {
            position: relative;
            height: 500px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Stock Market</h1>

        <div id="price">$100.00</div>

        <div class="info">
            Cash: $<span id="cash">1000.00</span><br>
            Shares: <span id="shares">0</span><br>
            Portfolio: $<span id="value">1000.00</span>
        </div>

        <input type="number" id="amount" min="1" placeholder="Shares">

        <button onclick="buyStock()">BUY</button>
        <button onclick="sellStock()">SELL</button>

        <br>

        <button onclick="showLine()">📈 Line</button>
        <button onclick="showBar()">📊 Bar</button>

        <div class="chart-container">
            <canvas id="stockChart"></canvas>
        </div>

    </div>

    <script>
    let labels = [];
    let prices = [];
    let chartType = "line";
    let stockChart;

    const ctx = document.getElementById("stockChart");

    function createChart() {
        if (stockChart) {
            stockChart.destroy();
        }

        stockChart = new Chart(ctx, {
            type: chartType,

            data: {
                labels: labels,

                datasets: [{
                    label: "Stock Price",
                    data: prices,
                    borderWidth: 2,
                    tension: 0.3,
                    pointRadius: 0
                }]
            },

            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,

                interaction: {
                    intersect: false,
                    mode: "index"
                },

                scales: {
                    x: {
                        ticks: {
                            color: "white"
                        }
                    },

                    y: {
                        ticks: {
                            color: "white"
                        }
                    }
                },

                plugins: {
                    legend: {
                        labels: {
                            color: "white"
                        }
                    },

                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return "$" + context.parsed.y.toFixed(2);
                            }
                        }
                    }
                }
            }
        });
    }

    function showLine() {
        chartType = "line";
        createChart();
    }

    function showBar() {
        chartType = "bar";
        createChart();
    }

    async function updateStock() {
        try {
            const response = await fetch("/stock-price/");
            const data = await response.json();

            const now = new Date();

            const time =
                now.getHours().toString().padStart(2, "0") +
                ":" +
                now.getMinutes().toString().padStart(2, "0") +
                ":" +
                now.getSeconds().toString().padStart(2, "0");

            labels.push(time);
            prices.push(data.price);

            if (labels.length > 60) {
                labels.shift();
                prices.shift();
            }

            document.getElementById("price").textContent =
                "$" + data.price.toFixed(2);

            document.getElementById("cash").textContent =
                data.cash.toFixed(2);

            document.getElementById("shares").textContent =
                data.shares;

            document.getElementById("value").textContent =
                data.value.toFixed(2);

            stockChart.data.labels = labels;
            stockChart.data.datasets[0].data = prices;

            stockChart.update();

        } catch (error) {
            console.log("Error:", error);
        }
    }

    async function buyStock() {
        const amount = document.getElementById("amount").value;

        if (amount <= 0) {
            return;
        }

        const response = await fetch("/buy/?amount=" + amount);
        const data = await response.json();

        document.getElementById("cash").textContent =
            data.cash.toFixed(2);

        document.getElementById("shares").textContent =
            data.shares;
    }

    async function sellStock() {
        const amount = document.getElementById("amount").value;

        if (amount <= 0) {
            return;
        }

        const response = await fetch("/sell/?amount=" + amount);
        const data = await response.json();

        document.getElementById("cash").textContent =
            data.cash.toFixed(2);

        document.getElementById("shares").textContent =
            data.shares;
    }

    createChart();
    updateStock();
    setInterval(updateStock, 1000);
    </script>

</body>
</html>
